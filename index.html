<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>도수도쿠도</title>
    <style>
        /* 1. 상단 잘림 방지 및 배경 설정 */
        body {
            margin: 0;
            padding: 0;
            background-color: #A8C217; /* 요청하신 배경색 */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            font-family: sans-serif;
            overflow: hidden; /* 불필요한 스크롤 방지 */
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100dvh; /* 주소창 제외 실제 화면 높이 */
            justify-content: center;
        }

        /* 2. 스도쿠 그리드 (올리신 grid.png 사용) */
        #sudoku-board {
            width: 350px;
            height: 350px;
            background-image: url('grid.png'); /* 올려두신 그리드 이미지 */
            background-size: contain;
            background-repeat: no-repeat;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            position: relative;
        }

        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
        }

        .cell.selected {
            background-color: rgba(255, 255, 255, 0.4); /* 선택된 셀 효과 */
        }

        /* 3. 기타 이미지 배치 (캐릭터, 로고 등) */
        .logo { width: 150px; margin-bottom: 20px; }
        .character { width: 80px; position: absolute; bottom: 20px; right: 20px; }

        /* 4. 숫자패드 디자인 */
        .numpad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .num-btn {
            width: 50px;
            height: 50px;
            background: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 로고 이미지 사용 -->
        <img src="logo.png" alt="logo" class="logo">

        <!-- 스도쿠 보드 -->
        <div id="sudoku-board">
            <!-- 81개의 셀이 자바스크립트로 생성됩니다 -->
        </div>

        <!-- 숫자 패드 -->
        <div class="numpad">
            <button class="num-btn">1</button>
            <button class="num-btn">2</button>
            <button class="num-btn">3</button>
            <button class="num-btn">4</button>
            <button class="num-btn">5</button>
            <button class="num-btn">6</button>
            <button class="num-btn">7</button>
            <button class="num-btn">8</button>
            <button class="num-btn">9</button>
            <button class="num-btn" style="background:#ddd;">X</button>
        </div>

        <!-- 캐릭터 이미지 사용 -->
        <img src="character.png" alt="character" class="character">
    </div>

    <script>
        const board = document.getElementById('sudoku-board');
        let selectedCell = null;

        // 81개 셀 생성
        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.addEventListener('click', () => {
                if (selectedCell) selectedCell.classList.remove('selected');
                selectedCell = cell;
                cell.classList.add('selected');
            });
            board.appendChild(cell);
        }

        // 숫자 입력 기능
        document.querySelectorAll('.num-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!selectedCell) return;
                if (btn.innerText === 'X') {
                    selectedCell.innerText = '';
                } else {
                    selectedCell.innerText = btn.innerText;
                }
            });
        });
    </script>
</body>
</html>
